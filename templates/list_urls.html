<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Shortened URLs</title>
</head>
<body>
    <h1>All Shortened URLs</h1>

    {% if urls %}
        <table border="1" cellpadding="8">
            <tr>
                <th>Short URL</th>
                <th>Original URL</th>
                <th>Action</th>
            </tr>
            {% for short, long in urls.items() %}
            <tr>
                <td><a href="{{ base_url }}{{ short }}" target="_blank">{{ base_url }}{{ short }}</a></td>
                <td><a href="{{ long }}" target="_blank">{{ long }}</a></td>
                <td>
                    <form method="POST" action="{{ url_for('delete_url', short_url=short) }}">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>No URLs have been shortened yet.</p>
    {% endif %}

    <p><a href="{{ url_for('index') }}">Back to Shortener</a></p>
</body>
</html>
